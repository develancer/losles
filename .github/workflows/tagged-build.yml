name: Tagged build

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="$(./tools/version.sh --from-tag "$GITHUB_REF_NAME")"
          build_version="$(make --no-print-directory print-version)"
          if [[ "$build_version" != "$tag_version" ]]; then
            echo "Build version '$build_version' does not match tag '$tag_version'." >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: validate
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu 24.04
            image: ubuntu:24.04
            target: ubuntu-24.04
            package_suffix: ubuntu24.04.1
          - label: Ubuntu 26.04
            image: ubuntu:26.04
            target: ubuntu-26.04
            package_suffix: ubuntu26.04.1
          - label: Debian 13
            image: debian:13
            target: debian-13
            package_suffix: debian13.1
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install build environment
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            appstream \
            build-essential \
            ca-certificates \
            debhelper \
            desktop-file-utils \
            devscripts \
            dpkg-dev \
            fakeroot \
            git \
            libcolord-dev \
            libgtk-4-dev \
            libjpeg-dev \
            liblcms2-dev \
            libpng-dev \
            libturbojpeg0-dev \
            lintian \
            pkgconf

      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust checked-out container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify checkout version
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${{ needs.validate.outputs.version }}"
          tag_version="$(./tools/version.sh --from-tag "$GITHUB_REF_NAME")"
          build_version="$(make --no-print-directory print-version)"
          if [[ "$tag_version" != "$expected_version" ]]; then
            echo "Tag version '$tag_version' does not match validated version '$expected_version'." >&2
            exit 1
          fi
          if [[ "$build_version" != "$expected_version" ]]; then
            echo "Build version '$build_version' does not match validated version '$expected_version'." >&2
            exit 1
          fi

      - name: Compile
        run: make -j2 SOURCE_ICON_FILE= prefix=/usr all

      - name: Run tests
        run: make -j2 SOURCE_ICON_FILE= prefix=/usr test

      - name: Stage installation
        run: make SOURCE_ICON_FILE= prefix=/usr DESTDIR="$PWD/build/stage" install

      - name: Prepare GitHub package changelog
        id: package_version
        shell: bash
        run: |
          set -euo pipefail
          package_version="${{ needs.validate.outputs.version }}-0losles1~${{ matrix.package_suffix }}"
          DEBFULLNAME="Piotr T. Różański" \
          DEBEMAIL="piotr@develancer.pl" \
            dch \
              --no-conf \
              --newversion "$package_version" \
              --distribution UNRELEASED \
              --force-distribution \
              "Automated GitHub release build."
          resolved_version="$(dpkg-parsechangelog --show-field Version)"
          if [[ "$resolved_version" != "$package_version" ]]; then
            echo "Generated package version '$resolved_version' does not match '$package_version'." >&2
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Build Debian package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          DEB_BUILD_OPTIONS=parallel=2 dpkg-buildpackage -b -us -uc
          package_version="${{ steps.package_version.outputs.version }}"
          package_arch="$(dpkg --print-architecture)"
          package_file="../losles_${package_version}_${package_arch}.deb"
          test -f "$package_file"
          resolved_version="$(dpkg-deb --field "$package_file" Version)"
          if [[ "$resolved_version" != "$package_version" ]]; then
            echo "Built package version '$resolved_version' does not match '$package_version'." >&2
            exit 1
          fi
          install -D -m 0644 "$package_file" "dist/$(basename "$package_file")"
          echo "path=dist/$(basename "$package_file")" >> "$GITHUB_OUTPUT"

      - name: Inspect Debian package
        run: |
          dpkg-deb --info "${{ steps.package.outputs.path }}"
          dpkg-deb --contents "${{ steps.package.outputs.path }}"
          lintian --fail-on error "${{ steps.package.outputs.path }}"

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: losles-${{ needs.validate.outputs.version }}-${{ matrix.target }}-amd64-deb
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x86-64 installer
    needs: validate
    runs-on: windows-2025

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-lcms2
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Verify checkout version
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # The checkout is created by Git for Windows but inspected by MSYS2
          # Git. Ignore filesystem mode emulation and rely on .gitattributes
          # for the repository's LF policy.
          git config --local core.autocrlf false
          git config --local core.filemode false
          tracked_changes="$(
            git status --porcelain=v1 --untracked-files=no
          )"
          if [[ -n "$tracked_changes" ]]; then
            echo "Tracked files changed while preparing the Windows build:" >&2
            printf '%s\n' "$tracked_changes" >&2
            git diff HEAD --stat >&2
            git diff HEAD --summary >&2
            exit 1
          fi

          expected_version="${{ needs.validate.outputs.version }}"
          tag_version="$(./tools/version.sh --from-tag "$GITHUB_REF_NAME")"
          build_version="$(make --no-print-directory print-version)"
          if [[ "$tag_version" != "$expected_version" ]]; then
            echo "Tag version '$tag_version' does not match validated version '$expected_version'." >&2
            exit 1
          fi
          if [[ "$build_version" != "$expected_version" ]]; then
            echo "Build version '$build_version' does not match validated version '$expected_version'." >&2
            exit 1
          fi

      - name: Compile
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make -j2 SOURCE_ICON_FILE= all

      - name: Run portable tests
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make -j2 SOURCE_ICON_FILE= test

      - name: Assemble installer payload
        shell: msys2 {0}
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          bundle="dist/losles-${version}-windows-x86_64"
          mkdir -p \
            "$bundle/bin" \
            "$bundle/lib/gdk-pixbuf-2.0/2.10.0/loaders" \
            "$bundle/share/glib-2.0/schemas" \
            "$bundle/share/icons/hicolor/512x512/apps" \
            "$bundle/share/licenses/losles"

          cp build/losles.exe "$bundle/bin/"
          cp COPYING README.md "$bundle/"
          cp COPYING README.md "$bundle/share/licenses/losles/"
          cp data/icons/hicolor/512x512/apps/io.github.develancer.losles.png \
            "$bundle/share/icons/hicolor/512x512/apps/"

          loader_directory="/ucrt64/lib/gdk-pixbuf-2.0/2.10.0/loaders"
          shopt -s nullglob
          pixbuf_loaders=()
          for loader_kind in jpeg png; do
            matching_loaders=(
              "$loader_directory"/*"$loader_kind"*.dll
            )
            if (( ${#matching_loaders[@]} == 0 )); then
              echo "No GdkPixbuf $loader_kind loader was installed." >&2
              exit 1
            fi
            pixbuf_loaders+=("${matching_loaders[@]}")
          done
          cp "${pixbuf_loaders[@]}" \
            "$bundle/lib/gdk-pixbuf-2.0/2.10.0/loaders/"

          gdk-pixbuf-query-loaders "${pixbuf_loaders[@]}" \
            > "$bundle/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"

          tools/copy-pe-runtime.sh \
            /ucrt64/bin \
            "$bundle/bin" \
            build/losles.exe \
            "${pixbuf_loaders[@]}"

          cp /ucrt64/share/glib-2.0/schemas/gschemas.compiled \
            "$bundle/share/glib-2.0/schemas/"
          cp -R /ucrt64/share/icons/Adwaita "$bundle/share/icons/"
          cp /ucrt64/share/icons/hicolor/index.theme \
            "$bundle/share/icons/hicolor/"
          if [[ -d /ucrt64/etc/fonts ]]; then
            mkdir -p "$bundle/etc"
            cp -R /ucrt64/etc/fonts "$bundle/etc/"
          fi

          declare -A runtime_packages=()
          runtime_assets=(
            "${pixbuf_loaders[@]}"
            /ucrt64/share/icons/Adwaita/index.theme
            /ucrt64/share/icons/hicolor/index.theme
          )
          for bundled_dll in "$bundle/bin"/*.dll; do
            runtime_assets+=("/ucrt64/bin/$(basename "$bundled_dll")")
          done
          if [[ -f /ucrt64/etc/fonts/fonts.conf ]]; then
            runtime_assets+=(/ucrt64/etc/fonts/fonts.conf)
          fi

          for runtime_asset in "${runtime_assets[@]}"; do
            if package="$(pacman -Qqo "$runtime_asset" 2>/dev/null)"; then
              runtime_packages["$package"]=1
            else
              echo "No package owner recorded for generated asset: $runtime_asset"
            fi
          done

          while IFS= read -r package; do
            while IFS= read -r license_file; do
              case "$license_file" in
                /ucrt64/share/licenses/*)
                  relative_license="${license_file#/ucrt64/share/licenses/}"
                  if [[ -f "$license_file" ]]; then
                    mkdir -p \
                      "$bundle/share/licenses/$(dirname "$relative_license")"
                    cp "$license_file" \
                      "$bundle/share/licenses/$relative_license"
                  fi
                  ;;
              esac
            done < <(pacman -Qlq "$package")
          done < <(printf '%s\n' "${!runtime_packages[@]}" | sort)

          echo "Installer payload contents:"
          du -sh "$bundle"
          find "$bundle/bin" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Build NSIS installer
        id: installer
        shell: msys2 {0}
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          bundle="dist/losles-${version}-windows-x86_64"
          installer="dist/losles-${version}-windows-x86_64-setup.exe"

          IFS=. read -r year month release_number <<< "$version"
          year=$((10#$year))
          month=$((10#$month))
          release_number=$((10#$release_number))
          if (( year > 65535 || month > 65535 || release_number > 65535 )); then
            echo "Version '$version' cannot be represented as a Windows PE version." >&2
            exit 1
          fi
          file_version="$year.$month.$release_number.0"

          payload_windows="$(cygpath -aw "$PWD/$bundle")"
          output_windows="$(cygpath -aw "$PWD/$installer")"
          icon_windows="$(cygpath -aw \
            "$PWD/data/icons/windows/io.github.develancer.losles.ico")"
          script_windows="$(cygpath -aw \
            "$PWD/packaging/windows/losles.nsi")"

          MSYS2_ARG_CONV_EXCL='*' makensis \
            "/DAPP_VERSION=$version" \
            "/DAPP_FILE_VERSION=$file_version" \
            "/DPAYLOAD_DIR=$payload_windows" \
            "/DOUTPUT_FILE=$output_windows" \
            "/DINSTALLER_ICON=$icon_windows" \
            "$script_windows"

          test -f "$installer"
          echo "Installer version: $version (PE $file_version)"
          du -h "$installer"
          sha256sum "$installer"
          echo "path=$installer" >> "$GITHUB_OUTPUT"

      - name: Smoke-test installer and uninstaller
        shell: msys2 {0}
        run: |
          set -euo pipefail
          installer="${{ steps.installer.outputs.path }}"
          smoke_root="$(cygpath -au "$RUNNER_TEMP")/losles-installer-smoke"
          smoke_windows="$(cygpath -aw "$smoke_root")"

          MSYS2_ARG_CONV_EXCL='*' "$installer" /S "/D=$smoke_windows"
          test -f "$smoke_root/bin/losles.exe"
          test -f "$smoke_root/uninstall.exe"
          test -f \
            "$smoke_root/share/icons/hicolor/512x512/apps/io.github.develancer.losles.png"
          MSYS2_ARG_CONV_EXCL='*' reg.exe query \
            'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\io.github.develancer.losles' \
            /v InstallLocation /reg:64

          MSYS2_ARG_CONV_EXCL='*' "$smoke_root/uninstall.exe" /S
          for attempt in {1..15}; do
            if [[ ! -e "$smoke_root/bin/losles.exe" ]]; then
              break
            fi
            sleep 1
          done
          test ! -e "$smoke_root/bin/losles.exe"
          if MSYS2_ARG_CONV_EXCL='*' reg.exe query \
            'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\io.github.develancer.losles' \
            /reg:64 >/dev/null 2>&1; then
            echo "The uninstaller left its Apps & Features registry key." >&2
            exit 1
          fi

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.installer.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs:
      - validate
      - build
      - windows
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Debian packages
        uses: actions/download-artifact@v8
        with:
          pattern: losles-${{ needs.validate.outputs.version }}-*-amd64-deb
          path: release-assets
          merge-multiple: true

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: losles-${{ needs.validate.outputs.version }}-windows-x86_64-setup.exe
          path: release-assets

      - name: Verify release assets and create checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          expected=(
            "losles_${version}-0losles1~ubuntu24.04.1_amd64.deb"
            "losles_${version}-0losles1~ubuntu26.04.1_amd64.deb"
            "losles_${version}-0losles1~debian13.1_amd64.deb"
            "losles-${version}-windows-x86_64-setup.exe"
          )
          mapfile -t packages < <(
            find release-assets \
              -maxdepth 1 \
              -type f \
              \( -name '*.deb' -o -name '*.exe' \) \
              -printf '%f\n' |
              sort
          )
          if [[ "${#packages[@]}" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} release packages, found ${#packages[@]}." >&2
            printf 'Found: %s\n' "${packages[@]}" >&2
            exit 1
          fi
          for package in "${expected[@]}"; do
            if [[ ! -f "release-assets/$package" ]]; then
              echo "Missing expected release package: $package" >&2
              exit 1
            fi
          done
          (
            cd release-assets
            sha256sum "${expected[@]}" > SHA256SUMS
          )

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${{ needs.validate.outputs.version }}"
          mapfile -t assets < <(
            find release-assets \
              -maxdepth 1 \
              -type f \
              \( -name '*.deb' -o -name '*.exe' -o -name SHA256SUMS \) |
              sort
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --generate-notes \
              --title "losles $version" \
              --verify-tag
          fi
